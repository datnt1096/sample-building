services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    command: bun dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    tty: true
    stdin_open: true

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    tty: true
    stdin_open: true

volumes:
  postgres_data:
